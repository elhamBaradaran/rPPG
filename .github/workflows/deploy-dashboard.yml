name: Deploy dashboard

# Rebuilds and republishes the results dashboard whenever the site or the results change.
# The site is a static export, so there is no server to run and nothing to pay for.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "results/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `npm run build` runs scripts/sync-data.mjs first, which copies results/ into
      # public/data. BASE_PATH is the repository name because Pages serves a project
      # site from /<repo> rather than the domain root.
      - name: Build static site
        working-directory: web
        run: npm run build
        env:
          BASE_PATH: /rPPG

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
